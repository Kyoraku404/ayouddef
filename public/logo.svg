<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none" width="100%" height="100%" aria-label="Marrakeshi Tour Guide Logo">
  <!-- Outer Arch Border in Gold -->
  <path d="M 10,132 L 10,65 C 10,40 26,18 50,6 C 74,18 90,40 90,65 L 90,132 Z" 
        stroke="#C79A47" stroke-width="3" fill="none" stroke-linejoin="round" />

  <!-- Inner Arch Frame -->
  <path d="M 16,128 L 16,66 C 16,44 30,25 50,14 C 70,25 84,44 84,66 L 84,128 Z" 
        stroke="#EBDCB9" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Top Point Star / Rosette Center (Moroccan 8-point motif) -->
  <!-- Stained Glass Segments -->
  <!-- Top Center Gold diamond -->
  <polygon points="50,22 58,34 50,46 42,34" fill="#C79A47" />
  <polygon points="50,26 55,34 50,42 45,34" fill="#FFFFFF" opacity="0.9" />

  <!-- Left & Right Blue petals -->
  <path d="M 42,34 L 26,38 C 28,48 34,56 42,60 L 50,46 Z" fill="#1D4ED8" opacity="0.95" />
  <path d="M 58,34 L 74,38 C 72,48 66,56 58,60 L 50,46 Z" fill="#1D4ED8" opacity="0.95" />

  <!-- Upper Red jewels -->
  <path d="M 28,37 C 22,46 18,55 18,65 L 34,64 L 42,50 Z" fill="#C1552D" />
  <path d="M 72,37 C 78,46 82,55 82,65 L 66,64 L 58,50 Z" fill="#C1552D" />

  <!-- Central Star Grid -->
  <polygon points="50,48 62,60 50,72 38,60" fill="#FFFFFF" />
  <polygon points="50,53 57,60 50,67 43,60" fill="#C79A47" />

  <!-- Middle Stained Glass Rows -->
  <polygon points="20,70 36,68 46,80 20,85" fill="#1E3A8A" />
  <polygon points="80,70 64,68 54,80 80,85" fill="#1E3A8A" />
  
  <polygon points="38,64 50,74 38,84 26,74" fill="#C1552D" />
  <polygon points="62,64 50,74 62,84 74,74" fill="#C1552D" />

  <!-- Lower Moroccan Diamond Tessellation -->
  <polygon points="50,76 64,88 50,100 36,88" fill="#C79A47" />
  <polygon points="50,81 58,88 50,95 42,88" fill="#FFFFFF" />

  <!-- Blue & Red Lower Wing Panes -->
  <polygon points="18,90 34,92 34,110 18,110" fill="#1D4ED8" opacity="0.9" />
  <polygon points="82,90 66,92 66,110 82,110" fill="#1D4ED8" opacity="0.9" />
  <polygon points="36,92 48,102 48,118 36,118" fill="#C1552D" />
  <polygon points="64,92 52,102 52,118 64,118" fill="#C1552D" />

  <!-- Bottom Arch Base Pillars & Fill -->
  <polygon points="50,104 60,114 50,124 40,114" fill="#FFFFFF" opacity="0.95" />
  <rect x="20" y="114" width="12" height="12" fill="#C79A47" />
  <rect x="68" y="114" width="12" height="12" fill="#C79A47" />

  <!-- Delicate Gold Leading (Cames) -->
  <line x1="50" y1="14" x2="50" y2="126" stroke="#C79A47" stroke-width="1.2" opacity="0.75" />
  <line x1="16" y1="66" x2="84" y2="66" stroke="#C79A47" stroke-width="1.2" opacity="0.75" />
  <line x1="16" y1="90" x2="84" y2="90" stroke="#C79A47" stroke-width="1.2" opacity="0.75" />
  <line x1="16" y1="112" x2="84" y2="112" stroke="#C79A47" stroke-width="1.2" opacity="0.75" />
  <line x1="12" y1="130" x2="88" y2="130" stroke="#C79A47" stroke-width="2" />
</svg>
